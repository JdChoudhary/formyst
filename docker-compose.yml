services:
  postgresdb:
    image: postgres:15
    restart: unless-stopped
    container_name: formystz_postgresdb

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres

    ports:
      - "5432:5432"

    volumes:
      - pg_data:/var/lib/postgresql/data

  # redis:
